[package]
name = "lattice-cashew"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
cid = "0.11"
multihash-codetable = { version = "0.2", features = ["sha2", "sha3", "blake2b", "blake2s", "blake3"] }
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
thiserror = "2"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
serde_json = "1"
lattice-array-trie = { path = "../array-trie-rs" }
